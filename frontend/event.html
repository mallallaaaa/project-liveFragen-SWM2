<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Join an event · OCCOR</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      body { background: linear-gradient(135deg, #123f63, #176e86) fixed; }
      .glass-box {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 32px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
      }
      .navbar-brand { color: #0d6efd; }
      .navbar-brand:hover, .navbar-brand:focus { color: #0a58ca; }
      #joined-event-title { overflow-wrap: anywhere; white-space: pre-wrap; }
    </style>
    <script src="event.js" defer></script>
  </head>
  <body class="min-vh-100 d-flex flex-column">
    <header class="position-absolute top-0 start-0 w-100">
      <nav class="navbar navbar-expand border-bottom" style="background-color: #eef6ff;">
        <div class="container"><span class="navbar-brand fw-bold">OCCOR</span></div>
      </nav>
    </header>
    <main class="min-vh-100 d-flex align-items-center justify-content-center" style="padding: 6rem 1rem 3rem;">
      <section class="glass-box w-100 p-4 text-white text-center" style="max-width: 760px;" aria-labelledby="join-heading">
        <h1 id="join-heading" class="h2">Join an event</h1>
        <p id="join-status" class="mt-3" role="status" aria-live="polite">Loading event…</p>
        <div id="joined-event" hidden>
          <h2 id="joined-event-title" class="h3"></h2>
          <p id="joined-event-id" class="mb-0"></p>
        </div>
        <button id="join-retry" class="btn glass-box text-white px-4 mt-3" type="button" hidden>Try again</button>
      </section>
    </main>
  </body>
</html>
